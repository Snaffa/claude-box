services:
  claude:
    build:
      context: ..
      dockerfile: claude-box/Dockerfile
      args:
        USERNAME: ${USER}
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
    image: claude-box
    stdin_open: true
    tty: true
    # No ssh key, no lab shares: Claude runs with permissions bypassed, so the
    # container only sees the projects, the reference papers and its own config.
    volumes:
      # All projects, read-write, at the same paths as on the host
      - ${HOME}/Projects:${HOME}/Projects
      # ...except the sandbox definition itself and the VS Code files that point
      # to it, so Claude can't widen its own mounts for the next launch
      - ${HOME}/Projects/claude-box:${HOME}/Projects/claude-box:ro
      - ${HOME}/Projects/.devcontainer:${HOME}/Projects/.devcontainer:ro
      # Claude's own config and login, kept separate from the host's ~/.claude
      - claude-config:${HOME}/.claude
      # Memory and session history for every project, shared with the host Claude
      # (folders are keyed by project path, which is identical inside and out)
      - ${HOME}/.claude/projects:${HOME}/.claude/projects
      # Git identity for commits (read-only; no ssh key or credentials are
      # mounted, so no pushing)
      - ${HOME}/.gitconfig:${HOME}/.gitconfig:ro
      # Reference papers, read-only, same path as on the host
      - ${HOME}/Documents/References:${HOME}/Documents/References:ro
      # ~/server: sshfs share of ebncsm2:/mnt (mounted at login by niri, see
      # ~/.config/niri/cfg/autostart.kdl), read-only. No rslave propagation on
      # purpose: a mount propagated in later would arrive read-write, so the
      # share must be mounted before the container starts (restart it otherwise).
      - type: bind
        source: ${HOME}/server
        target: ${HOME}/server
        read_only: true
      # Herdr's config and saved workspaces, kept when the container is recreated
      - herdr-state:${HOME}/.config/herdr

volumes:
  claude-config:
    # Fixed name so the login is shared by claude-box.sh and the VS Code dev
    # container (which use different compose project names)
    name: claude-box_claude-config
  herdr-state:
    name: claude-box_herdr-state
